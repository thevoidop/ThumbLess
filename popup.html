<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 220px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #181818;
      color: #f1f1f1;
    }

    h2 {
      font-size: 15px;
      margin: 0 0 14px 0;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .setting {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      font-size: 13px;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 36px;
      height: 20px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background-color: #3f3f3f;
      transition: .2s;
      border-radius: 20px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .2s;
      border-radius: 50%;
    }

    input:checked+.slider {
      background-color: #3ea6ff;
    }

    input:checked+.slider:before {
      transform: translateX(16px);
    }
  </style>
</head>

<body>
  <h2>ThumbLess</h2>

  <div class="setting">
    <span>Hide Thumbnails</span>
    <label class="switch">
      <input type="checkbox" id="hideThumbnails" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div class="setting">
    <span>Hide Shorts</span>
    <label class="switch">
      <input type="checkbox" id="hideShorts" checked>
      <span class="slider"></span>
    </label>
  </div>

  <script src="popup.js"></script>
</body>

</html>
